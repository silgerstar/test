services:
  - type: web
    name: study-assistant-api
    env: python
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: gunicorn --bind 0.0.0.0:10000 --workers 2 --timeout 120 "app:create_app()"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: study-assistant-db
          property: connectionString
      - key: API_KEY
        sync: false  # Render 대시보드에서 설정 필요
      - key: CRON_TOKEN
        sync: false  # Render 대시보드에서 설정 필요
      - key: FLASK_ENV
        value: production
    healthCheckPath: /

  - type: worker
    name: study-assistant-expirer
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.workers.expire_jobs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: study-assistant-db
          property: connectionString
      - key: CRON_TOKEN
        sync: false  # Render 대시보드에서 설정 필요
      - key: FLASK_ENV
        value: production

databases:
  - name: study-assistant-db
    databaseName: study_assistant
    user: study_assistant_user
    plan: free  # 또는 starter, standard 등
